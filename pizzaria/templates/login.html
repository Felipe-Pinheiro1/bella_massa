{% extends 'base.html' %}
{% block title %}Login · Bella Massa{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;background:var(--vinho);color:var(--creme)">
  <h1 style="color:var(--creme);text-align:center">LOGIN</h1>
  {% if form.errors %}<div class="msg error">Login ou senha inválidos.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label>Login<br>{{ form.username }}</label></p>
    <p><label>Senha<br>{{ form.password }}</label></p>
    <button class="btn">Login</button>
  </form>
</div>
{% endblock %}
